        function mapToLineupChainsForWindPlot([club, x], directionIndex) {
            const rootDistance = parseInt(club.substring(0,club.length-1));
            const lineups = Object.entries(x).map(([windString, lineup]) => lineup/*.floored()*/);

            // Fill lineup gaps via linear interpolation between known data
            let lowerKnownIndex = 0;
            let upperKnownIndex = 0;
            let lowerKnownLineup = lineups[0];
            let upperKnownLineup =  lineups[0];
            for (let i = 0; i < lineups.length - 1; i++) {
                const lineup = lineups[i];
        
                if (lineup.isKnown()) {
                    lowerKnownIndex = i;
                    lowerKnownLineup = lineups[i];
                    continue;
                }

                if (upperKnownIndex <= i) {
                    for (j = i + 1; j < lineups.length; j++) {
                        const potentialLineup = lineups[j];
        
                        if (potentialLineup.isKnown()) {
                            upperKnownIndex = j;
                            upperKnownLineup = lineups[j];
                            break;
                        }
                    }
                }

                const gapBetweenKnownLineups = upperKnownIndex - lowerKnownIndex;
                const t = (i - lowerKnownIndex) / gapBetweenKnownLineups;

                const distance = interpolate(t, lowerKnownLineup.distance, upperKnownLineup.distance);
                const offset = interpolate(t, lowerKnownLineup.offset, upperKnownLineup.offset);
                lineups[i] = new Lineup(distance, offset);
            }

            // Scale dots based on wind strength
            const dotScales = Array(16).fill(0);
            for (let i = 0; i < dotScales.length; i++) {
                const min = 0.65;
            }
            dotScales[0] = 0.45;
            // dotScales[1] = 0.45;
            dotScales[5] = directionIndex % 2 === 0 ? 0.8 : 0;
            dotScales[10] = directionIndex % 4 === 0 ? 0.7 : 0;
            dotScales[15] = directionIndex % 4 === 0 ? -0.4 : 0;

            // Color dots based on wind strength
            const dotColors = Array(16).fill('red');
            for (let i = 0; i < dotColors.length; i++) {
                dotColors[i] = interpolateColor(i / dotColors.length, '#c7ffc2', 'yellow', 'red');
            }
            dotColors[0] = 'white';
            // dotColors[5] = '#191919';
            // dotColors[10] = '#191919';

            // Normalize lineup distances/offsets to integers
            for (let i = 0; i < lineups.length; i++) {
                // lineups[i] = lineups[i].floored();
                // lineups[i] = new Lineup(lineups[i].distance, Math.round(lineups[i].offset));
            }

            let lineColors = Array(322).fill('black');
            if (directionIndex % 4 === 0) {
                lineColors = Array(322).fill('black') 
            } else if ((directionIndex + 2) % 4 === 0) {
                lineColors = Array(322).fill('black')
            } else {
                lineColors = Array(322).fill('rgba(135, 135, 135, 0.5)');
            }
            

            return new LineupChain(lineups, rootDistance, dotScales, dotColors, lineColors);
        }

        function connectWindDirectionsWithWeb(lineupChains) {
            const newLineupChains = [];

            const newLineupChain = (lineups, windStrength) => {
                const rootDistance = NaN;

                const dotScales = Array(32).fill(0);
                const dotColors = Array(32).fill('black');
                let lineColors = Array(32).fill('rgba(135, 135, 135, 0.48)');

                if (windStrength === 1 || windStrength === 5 || windStrength === 15) {
                    lineColors = Array(32).fill('black');
                } else if (windStrength === 10) {
                    lineColors = Array(32).fill('grey');
                }

                return new LineupChain(
                    lineups,
                    rootDistance,
                    dotScales,
                    dotColors,
                    lineColors,
                );         
            }

            // connect N -> NW+1 -> N
            for (let i = 0; i < 16; i++) {
                const lineups = [
                ];
                for (let j = 0; j < lineupChains[i].lineups.length; j++) {
                    lineups.push(
                        lineupChains[j].lineups[i]
                    );
                }
                if (i > 0) {
                    lineups.push(
                        lineupChains[0].lineups[i]
                    );
                    newLineupChains.push(newLineupChain(lineups, i));
                }
            }

            return newLineupChains.concat(lineupChains);
        }

        function createWindPlotLabels(lineupChains) {
            const labels = [];
            for (let directionIndex = 0; directionIndex < 16; directionIndex++) {
                const lineupChainIndex = lineupChains.length - 16 + directionIndex;

                const zeroLineup = lineupChains[lineupChainIndex].lineups[0];
                const fifteenLineup = lineupChains[lineupChainIndex].lineups[15];

                const xDeltaPerWind = (fifteenLineup.offset - zeroLineup.offset) / 15;
                const yDeltaPerWind = (fifteenLineup.distance - zeroLineup.distance) / 15;
                const xt = 15.9;
                const yt = 17.9;

                const xlabelLineup = new Lineup(
                    zeroLineup.distance + (xt * yDeltaPerWind),
                    zeroLineup.offset + (xt * xDeltaPerWind)
                )

                const ylabelLineup = new Lineup(
                    zeroLineup.distance + (yt * yDeltaPerWind),
                    zeroLineup.offset + (yt * xDeltaPerWind)
                )

                const xText = (xDeltaPerWind === 0 ? '0' : (xDeltaPerWind > 0 ? `${xDeltaPerWind.toFixed(1)}→` : `←${Math.abs(xDeltaPerWind.toFixed(1))}`)) + `(${Math.round(xDeltaPerWind * 15)})`;
                const yText = (yDeltaPerWind === 0 ? '0' : (yDeltaPerWind > 0 ? `${yDeltaPerWind.toFixed(1)}↑` : `${Math.abs(yDeltaPerWind.toFixed(1))}↓ `)) + `(${Math.round(yDeltaPerWind * 15)})`;

                // labels.push(new Label(
                //     xText,
                //     xlabelLineup,
                //     "center",
                //     "Verdana",
                //     1.4,
                //     "black",
                //     0.25,
                // ));

                labels.push(new Label(
                    yText,
                    ylabelLineup,
                    "center",
                    "Verdana",
                    2,
                    "black",
                    0.25,
                ));
            }
            return labels;
        }

        function interpolate(t, from, to) {

        }

        function interpolateColor(
            t,
            c1 = "red",
            c2 = "yellow",
            c3 = "green"
        ) {
            t = Math.max(0, Math.min(1, t));

            const parse = (c) => {
                const ctx = document.createElement("canvas").getContext("2d");
                ctx.fillStyle = c;
                const s = ctx.fillStyle;

                if (s.startsWith("#")) {
                    let hex = s.slice(1);
                if (hex.length === 3) hex = hex.split("").map(x => x + x).join("");
                    const n = parseInt(hex, 16);
                    return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
                }

                const m = s.match(/\d+/g).map(Number);
                return [m[0], m[1], m[2]];
            };

            const a = parse(c1);
            const b = parse(c2);
            const c = c3 ? parse(c3) : null;

            const lerp = (x, y, t) => Math.round(x + (y - x) * t);

            if (!c) {
                return `rgb(${lerp(a[0], b[0], t)}, ${lerp(a[1], b[1], t)}, ${lerp(a[2], b[2], t)})`;
            }

            if (t <= 0.5) {
                const tt = t / 0.5;
                return `rgb(${lerp(a[0], b[0], tt)}, ${lerp(a[1], b[1], tt)}, ${lerp(a[2], b[2], tt)})`;
            }

            const tt = (t - 0.5) / 0.5;
            return `rgb(${lerp(b[0], c[0], tt)}, ${lerp(b[1], c[1], tt)}, ${lerp(b[2], c[2], tt)})`;
        }
